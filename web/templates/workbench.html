<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CleaningCar 工作台</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #10151c; color: #e8edf4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #10151c; }
    header { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; background: #171e27; border-bottom: 1px solid #2a3442; position: sticky; top: 0; z-index: 3; }
    h1, h2, h3 { margin: 0; } h1 { font-size: 20px; } h2 { font-size: 17px; } h3 { font-size: 14px; color: #b9c7d8; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; } a, button { color: inherit; font: inherit; }
    a, button { border: 1px solid #344355; border-radius: 6px; padding: 8px 12px; background: #202a37; text-decoration: none; cursor: pointer; }
    a:hover, button:hover { border-color: #5f8fca; background: #27384d; } button.primary { background: #2d6ea8; border-color: #4d94d2; }
    main { max-width: 1500px; margin: 0 auto; padding: 24px; }
    .toolbar, .status-strip, .detail-grid { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .toolbar { margin: 18px 0; } input, select { min-height: 36px; border: 1px solid #344355; border-radius: 6px; background: #0d131a; color: #e8edf4; padding: 7px 10px; }
    input[type=search] { min-width: 240px; } .status-strip { margin-bottom: 18px; }
    .status { padding: 8px 12px; border-radius: 999px; background: #1e2b38; color: #b7d7ef; } .status.ok { background: #17372f; color: #91e1bb; } .status.bad { background: #45262a; color: #ffb6b6; }
    .table-wrap { overflow-x: auto; border: 1px solid #2a3442; border-radius: 8px; background: #151c24; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; } th, td { padding: 11px 12px; border-bottom: 1px solid #27313e; text-align: left; white-space: nowrap; } th { color: #9fb0c2; font-size: 12px; font-weight: 500; } td { font-size: 13px; }
    tr.clickable { cursor: pointer; } tr.clickable:hover { background: #1d2a38; } .muted { color: #8d9bad; } .danger { color: #ffadad; } .good { color: #91e1bb; }
    .pager { display: flex; justify-content: flex-end; gap: 8px; align-items: center; margin-top: 14px; }
    dialog { width: min(900px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; border: 1px solid #3c4b5d; border-radius: 10px; background: #151c24; color: #e8edf4; padding: 0; } dialog::backdrop { background: #000b; }
    .dialog-head { display: flex; justify-content: space-between; gap: 12px; padding: 18px; border-bottom: 1px solid #2a3442; } .dialog-body { padding: 18px; }
    .detail-grid > section { flex: 1 1 280px; } .timeline { display: grid; gap: 8px; } .stage { border-left: 3px solid #4d94d2; padding: 8px 10px; background: #1b2531; } .stage strong { color: #9ecaf0; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; } .shot { margin: 0; background: #1b2531; border-radius: 6px; overflow: hidden; } .shot a { display: block; padding: 0; border: 0; border-radius: 0; background: transparent; } .shot img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #0b0f14; } .shot figcaption { padding: 8px 10px; color: #b9c7d8; font-size: 12px; } .event-video { display: block; width: 100%; max-height: 520px; margin-top: 10px; background: #0b0f14; border-radius: 6px; } .empty { padding: 42px; text-align: center; color: #8d9bad; }
    @media (max-width: 720px) { header { align-items: flex-start; flex-direction: column; } main { padding: 16px; } input[type=search] { min-width: 0; width: 100%; } }
  </style>
</head>
<body>
  <header>
    <div><h1>CleaningCar 工作台</h1><div class="muted" id="subtitle">事件台账与现场运行视图</div></div>
    <nav><a href="/workbench">事件台账</a><a href="/workbench/settings">系统设置</a></nav>
  </header>
  <main>
    <section class="status-strip" aria-live="polite"><span id="runtimeStatus" class="status">正在读取运行状态…</span><span id="eventCount" class="status">事件：-</span><span id="configName" class="status">配置：-</span></section>
    <section class="toolbar">
      <select id="configSelect" aria-label="配置文件"></select>
      <input id="search" type="search" placeholder="搜索车牌、车型或业务 ID">
      <select id="status" aria-label="事件状态"><option value="">全部状态</option><option>进行中</option><option>已结束</option></select>
      <select id="abnormal" aria-label="异常筛选"><option value="">全部事件</option><option value="yes">仅异常</option><option value="no">仅正常</option></select>
      <button class="primary" id="refresh">刷新</button>
    </section>
    <section class="table-wrap"><table><thead><tr><th>配置</th><th>业务 ID</th><th>时间</th><th>车牌</th><th>车型</th><th>颜色</th><th>冲洗时长</th><th>状态</th><th>复核</th><th>上报</th></tr></thead><tbody id="rows"><tr><td colspan="10" class="empty">正在读取事件…</td></tr></tbody></table></section>
    <div class="pager"><span class="muted" id="pageInfo">-</span><button id="prev">上一页</button><button id="next">下一页</button></div>
  </main>
  <dialog id="detail"><div class="dialog-head"><div><h2 id="detailTitle">事件详情</h2><div class="muted" id="detailMeta"></div></div><button id="closeDetail">关闭</button></div><div class="dialog-body"><div class="detail-grid"><section><h3>阶段时间线</h3><div id="timeline" class="timeline"></div></section><section><h3>车轮结果</h3><pre id="wheelResults" class="muted">暂无车轮结果</pre></section></div><h3 style="margin-top:18px">全部阶段截图</h3><div id="captureGallery" class="gallery"></div><h3 style="margin-top:18px">单车录像</h3><div id="videoBox" class="empty">暂无单车录像</div><h3 style="margin-top:18px">原始事件</h3><pre id="rawEvent" class="muted"></pre></div></dialog>
  <script>
    const state = { key: '', page: 1, pageSize: 20 };
    const $ = (id) => document.getElementById(id);
    async function json(url, options) { const res = await fetch(url, options); if (!res.ok) throw new Error(await res.text()); return res.json(); }
    function keyed(path) { return state.key ? `${path}${path.includes('?') ? '&' : '?'}key=${encodeURIComponent(state.key)}` : path; }
    async function loadConfigs() { const data = await json('/config/files'); const select = $('configSelect'); select.innerHTML = '<option value="__all__">全部配置</option>'; for (const name of data.files || []) { const option = document.createElement('option'); option.value = name; option.textContent = `${name}${data.device_ids?.[name] ? ` · ${data.device_ids[name]}` : ''}`; select.appendChild(option); } state.key = ''; state.allConfigs = true; select.value = '__all__'; select.onchange = () => { state.allConfigs = select.value === '__all__'; state.key = state.allConfigs || select.value === data.active ? '' : select.value; state.page = 1; refresh(); }; }
    async function loadRuntime() { try { const data = await json(keyed('/workbench/runtime')); const inf = data.inference || {}; const healthy = inf.running && inf.heartbeat?.healthy !== false; $('runtimeStatus').textContent = healthy ? '推理运行正常' : (inf.running ? '推理需要关注' : '推理未运行'); $('runtimeStatus').className = `status ${healthy ? 'ok' : 'bad'}`; $('eventCount').textContent = `事件：${data.events?.count ?? 0}`; $('configName').textContent = state.allConfigs ? '当前查看：全部配置' : `${data.device_id || '-'} · ${data.config || '-'}`; } catch (err) { $('runtimeStatus').textContent = '运行状态读取失败'; $('runtimeStatus').className = 'status bad'; } }
    async function loadEvents() { const params = new URLSearchParams({ page: state.page, page_size: state.pageSize, query: $('search').value, status: $('status').value, abnormal: $('abnormal').value }); params.set('config_name', state.allConfigs ? '' : (state.key || $('configSelect').value)); if (state.allConfigs) params.set('key', '__all__'); else if (state.key) params.set('key', state.key); const data = await json(`/workbench/events?${params}`); const tbody = $('rows'); tbody.innerHTML = ''; if (!data.items?.length) { tbody.innerHTML = '<tr><td colspan="10" class="empty">没有匹配事件</td></tr>'; } else { for (const row of data.items) { const tr = document.createElement('tr'); tr.className = 'clickable'; tr.onclick = () => showDetail(row.id); const abnormal = row.abnormal ? `<span class="danger">${row.abnormalReason || '异常'}</span>` : (row.stageAbnormalReasons?.length ? '<span class="muted">历史阶段异常</span>' : '<span class="good">正常</span>'); tr.innerHTML = `<td>${row.configName || '未知配置'}</td><td>${row.id}</td><td>${row.captureTime || '-'}</td><td>${row.plateNumber || '<span class="muted">未识别</span>'}</td><td>${row.vehicleType || '-'}</td><td>${row.plateColor || '-'}</td><td>${Number(row.washDuration || 0).toFixed(1)} s</td><td>${row.status}</td><td>${abnormal}</td><td class="muted">${row.uploadStatus}</td>`; tbody.appendChild(tr); } } $('pageInfo').textContent = `${data.total} 条 · 第 ${data.page} 页`; $('prev').disabled = state.page <= 1; $('next').disabled = state.page * state.pageSize >= data.total; }
    function mediaUrl(path) { return `/workbench/media?path=${encodeURIComponent(path)}${state.allConfigs ? '&key=__all__' : (state.key ? `&key=${encodeURIComponent(state.key)}` : '')}`; }
    async function showDetail(id) { const detailKey = state.allConfigs ? `?key=__all__` : (state.key ? `?key=${encodeURIComponent(state.key)}` : ''); const data = await json(`/workbench/events/${encodeURIComponent(id)}${detailKey}`); $('detailTitle').textContent = `事件 ${data.id}`; $('detailMeta').textContent = `${data.configName || '未知配置'} · ${data.captureTime || '-'} · ${data.lane || '-'} · ${data.plateNumber || '未识别'}`; $('timeline').innerHTML = (data.stages || []).map(stage => `<div class="stage"><strong>Type ${stage.type}</strong> · ${stage.captureTime || '-'}${stage.isAbnormal ? `<div class="danger">阶段异常：${stage.abnormalReason || '异常'}</div>` : ''}<div class="muted">${stage.washDuration ? `时长 ${stage.washDuration}s` : ''}</div></div>`).join('') || '<div class="empty">暂无阶段记录</div>'; const shots=(data.stages||[]).filter(stage=>stage.captureImage); $('captureGallery').innerHTML=shots.length?shots.map(stage=>{const src=mediaUrl(stage.captureImage);return `<figure class="shot"><a href="${src}" target="_blank"><img src="${src}" loading="lazy" alt="Type ${stage.type} 事件截图"></a><figcaption>Type ${stage.type} · ${stage.captureTime||'-'}</figcaption></figure>`;}).join(''):'<div class="empty">该业务 ID 暂无阶段截图</div>'; const videoBox=$('videoBox'); if(data.videoPath){const src=mediaUrl(data.videoPath);videoBox.className='';videoBox.innerHTML=`<video class="event-video" controls preload="metadata" src="${src}">浏览器不支持视频播放。</video><div class="muted" style="margin-top:6px"><a href="${src}" target="_blank">在新窗口打开录像</a></div>`;}else{videoBox.className='empty';videoBox.textContent='该业务 ID 暂无单车录像';} $('wheelResults').textContent = data.wheelResults?.length ? JSON.stringify(data.wheelResults, null, 2) : '暂无车轮结果'; $('rawEvent').textContent = JSON.stringify(data, null, 2); $('detail').showModal(); }
    async function refresh() { await Promise.all([loadRuntime(), loadEvents()]); }
    $('refresh').onclick = () => { state.page = 1; refresh(); }; $('search').onkeydown = (event) => { if (event.key === 'Enter') { state.page = 1; refresh(); } }; $('status').onchange = () => { state.page = 1; refresh(); }; $('abnormal').onchange = () => { state.page = 1; refresh(); }; $('prev').onclick = () => { state.page--; refresh(); }; $('next').onclick = () => { state.page++; refresh(); }; $('closeDetail').onclick = () => $('detail').close();
    (async () => { await loadConfigs(); await refresh(); })().catch(err => { $('rows').innerHTML = `<tr><td colspan="10" class="empty">读取失败：${err.message}</td></tr>`; });
  </script>
</body>
</html>
