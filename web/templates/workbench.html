<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CleaningCar 工作台</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #10151c; color: #e8edf4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #10151c; }
    header { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; background: #171e27; border-bottom: 1px solid #2a3442; position: sticky; top: 0; z-index: 3; }
    h1, h2, h3 { margin: 0; } h1 { font-size: 20px; } h2 { font-size: 17px; } h3 { font-size: 14px; color: #b9c7d8; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; } a, button { color: inherit; font: inherit; }
    a, button { border: 1px solid #344355; border-radius: 6px; padding: 8px 12px; background: #202a37; text-decoration: none; cursor: pointer; }
    a:hover, button:hover { border-color: #5f8fca; background: #27384d; } button.primary { background: #2d6ea8; border-color: #4d94d2; } button:disabled { cursor: not-allowed; opacity: .45; }
    main { max-width: 1500px; margin: 0 auto; padding: 24px; }
    .toolbar, .status-strip, .detail-grid { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .toolbar { margin: 18px 0; } input, select { min-height: 36px; border: 1px solid #344355; border-radius: 6px; background: #0d131a; color: #e8edf4; padding: 7px 10px; }
    input[type=search] { min-width: 240px; } .status-strip { margin-bottom: 18px; }
    .status { padding: 8px 12px; border-radius: 999px; background: #1e2b38; color: #b7d7ef; } .status.ok { background: #17372f; color: #91e1bb; } .status.bad { background: #45262a; color: #ffb6b6; }
    .table-wrap { overflow-x: auto; border: 1px solid #2a3442; border-radius: 8px; background: #151c24; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; } th, td { padding: 11px 12px; border-bottom: 1px solid #27313e; text-align: left; white-space: nowrap; } th { color: #9fb0c2; font-size: 12px; font-weight: 500; } td { font-size: 13px; }
    tr.clickable { cursor: pointer; } tr.clickable:hover { background: #1d2a38; } .muted { color: #8d9bad; } .danger { color: #ffadad; } .good { color: #91e1bb; }
    .pager { display: flex; justify-content: flex-end; gap: 8px; align-items: center; margin-top: 14px; }
    dialog { width: min(1050px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; border: 1px solid #3c4b5d; border-radius: 10px; background: #151c24; color: #e8edf4; padding: 0; } dialog::backdrop { background: #000b; }
    .dialog-head { display: flex; justify-content: space-between; gap: 12px; padding: 18px; border-bottom: 1px solid #2a3442; } .dialog-body { padding: 18px; }
    .detail-grid > section { flex: 1 1 280px; } .timeline { display: grid; gap: 8px; } .stage { border-left: 3px solid #4d94d2; padding: 8px 10px; background: #1b2531; } .stage strong { color: #9ecaf0; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; } .shot { margin: 0; background: #1b2531; border-radius: 6px; overflow: hidden; } .shot a { display: block; padding: 0; border: 0; border-radius: 0; background: transparent; } .shot img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #0b0f14; } .shot figcaption { padding: 8px 10px; color: #b9c7d8; font-size: 12px; } .event-video { display: block; width: 100%; max-height: 520px; margin-top: 10px; background: #0b0f14; border-radius: 6px; } .empty { padding: 42px; text-align: center; color: #8d9bad; }
    .agent-panel { margin-top: 20px; padding: 16px; border: 1px solid #31516d; border-radius: 8px; background: #111c27; } .agent-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; } .agent-actions { display: flex; gap: 8px; flex-wrap: wrap; } .agent-output { min-height: 180px; max-height: 520px; overflow: auto; margin: 12px 0 0; padding: 16px; border-radius: 6px; background: #0b1118; color: #dce8f4; white-space: pre-wrap; word-break: break-word; line-height: 1.7; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; } .agent-output.generating::after { content: "▋"; color: #69b8ff; animation: blink .8s infinite; } @keyframes blink { 50% { opacity: 0; } }
    @media (max-width: 720px) { header { align-items: flex-start; flex-direction: column; } main { padding: 16px; } input[type=search] { min-width: 0; width: 100%; } }
  </style>
</head>
<body>
  <header>
    <div><h1>CleaningCar 工作台</h1><div class="muted" id="subtitle">事件台账与现场运行视图</div></div>
    <nav><a href="/workbench">事件台账</a><a href="/workbench/settings">系统设置</a></nav>
  </header>
  <main>
    <section class="status-strip" aria-live="polite"><span id="runtimeStatus" class="status">正在读取运行状态…</span><span id="eventCount" class="status">事件：-</span><span id="configName" class="status">配置：-</span></section>
    <section class="toolbar">
      <select id="configSelect" aria-label="配置文件"></select>
      <input id="search" type="search" placeholder="搜索车牌、车型或业务 ID">
      <select id="status" aria-label="事件状态"><option value="">全部状态</option><option>进行中</option><option>已结束</option></select>
      <select id="abnormal" aria-label="异常筛选"><option value="">全部事件</option><option value="yes">仅异常</option><option value="no">仅正常</option></select>
      <button class="primary" id="refresh">刷新</button>
    </section>
    <section class="table-wrap"><table><thead><tr><th>配置</th><th>业务 ID</th><th>时间</th><th>车牌</th><th>车型</th><th>颜色</th><th>冲洗时长</th><th>状态</th><th>复核</th><th>上报</th></tr></thead><tbody id="rows"><tr><td colspan="10" class="empty">正在读取事件…</td></tr></tbody></table></section>
    <div class="pager"><span class="muted" id="pageInfo">-</span><button id="prev">上一页</button><button id="next">下一页</button></div>
  </main>
  <dialog id="detail"><div class="dialog-head"><div><h2 id="detailTitle">事件详情</h2><div class="muted" id="detailMeta"></div></div><button id="closeDetail">关闭</button></div><div class="dialog-body"><div class="detail-grid"><section><h3>阶段时间线</h3><div id="timeline" class="timeline"></div></section><section><h3>车轮结果</h3><pre id="wheelResults" class="muted">暂无车轮结果</pre></section></div><h3 style="margin-top:18px">全部阶段截图</h3><div id="captureGallery" class="gallery"></div><h3 style="margin-top:18px">单车录像</h3><div id="videoBox" class="empty">暂无单车录像</div><section class="agent-panel"><div class="agent-head"><div><h3>大模型过车分析</h3><div id="agentStatus" class="muted">正在检查报告服务…</div></div><div class="agent-actions"><button class="primary" id="analyzeReport">大模型分析</button><button id="stopReport" disabled>停止生成</button><button id="downloadReport" disabled>下载 Markdown</button><button id="captureReport" disabled>导出报告截图</button></div></div><pre id="agentOutput" class="agent-output muted">点击“大模型分析”，将精简后的算法记录发送给已配置的模型。</pre></section><h3 style="margin-top:18px">原始事件</h3><pre id="rawEvent" class="muted"></pre></div></dialog>
  <script>
    const state = { key: '', page: 1, pageSize: 20, currentEvent: null, reportText: '', reportAbort: null, reportGeneratedAt: '' };
    const $ = (id) => document.getElementById(id);
    async function json(url, options) { const res = await fetch(url, options); if (!res.ok) throw new Error(await res.text()); return res.json(); }
    function keyed(path) { return state.key ? `${path}${path.includes('?') ? '&' : '?'}key=${encodeURIComponent(state.key)}` : path; }
    async function loadConfigs() { const data = await json('/config/files'); const select = $('configSelect'); select.innerHTML = '<option value="__all__">全部配置</option>'; for (const name of data.files || []) { const option = document.createElement('option'); option.value = name; option.textContent = `${name}${data.device_ids?.[name] ? ` · ${data.device_ids[name]}` : ''}`; select.appendChild(option); } state.key = ''; state.allConfigs = true; select.value = '__all__'; select.onchange = () => { state.allConfigs = select.value === '__all__'; state.key = state.allConfigs || select.value === data.active ? '' : select.value; state.page = 1; refresh(); }; }
    async function loadRuntime() { try { const data = await json(keyed('/workbench/runtime')); const inf = data.inference || {}; const healthy = inf.running && inf.heartbeat?.healthy !== false; $('runtimeStatus').textContent = healthy ? '推理运行正常' : (inf.running ? '推理需要关注' : '推理未运行'); $('runtimeStatus').className = `status ${healthy ? 'ok' : 'bad'}`; $('eventCount').textContent = `事件：${data.events?.count ?? 0}`; $('configName').textContent = state.allConfigs ? '当前查看：全部配置' : `${data.device_id || '-'} · ${data.config || '-'}`; } catch (err) { $('runtimeStatus').textContent = '运行状态读取失败'; $('runtimeStatus').className = 'status bad'; } }
    async function loadEvents() { const params = new URLSearchParams({ page: state.page, page_size: state.pageSize, query: $('search').value, status: $('status').value, abnormal: $('abnormal').value }); params.set('config_name', state.allConfigs ? '' : (state.key || $('configSelect').value)); if (state.allConfigs) params.set('key', '__all__'); else if (state.key) params.set('key', state.key); const data = await json(`/workbench/events?${params}`); const tbody = $('rows'); tbody.innerHTML = ''; if (!data.items?.length) { tbody.innerHTML = '<tr><td colspan="10" class="empty">没有匹配事件</td></tr>'; } else { for (const row of data.items) { const tr = document.createElement('tr'); tr.className = 'clickable'; tr.onclick = () => showDetail(row.id); const abnormal = row.abnormal ? `<span class="danger">${row.abnormalReason || '异常'}</span>` : (row.stageAbnormalReasons?.length ? '<span class="muted">历史阶段异常</span>' : '<span class="good">正常</span>'); tr.innerHTML = `<td>${row.configName || '未知配置'}</td><td>${row.id}</td><td>${row.captureTime || '-'}</td><td>${row.plateNumber || '<span class="muted">未识别</span>'}</td><td>${row.vehicleType || '-'}</td><td>${row.plateColor || '-'}</td><td>${Number(row.washDuration || 0).toFixed(1)} s</td><td>${row.status}</td><td>${abnormal}</td><td class="muted">${row.uploadStatus}</td>`; tbody.appendChild(tr); } } $('pageInfo').textContent = `${data.total} 条 · 第 ${data.page} 页`; $('prev').disabled = state.page <= 1; $('next').disabled = state.page * state.pageSize >= data.total; }
    function mediaUrl(path) { return `/workbench/media?path=${encodeURIComponent(path)}${state.allConfigs ? '&key=__all__' : (state.key ? `&key=${encodeURIComponent(state.key)}` : '')}`; }
    function detailKey() { return state.allConfigs ? '?key=__all__' : (state.key ? `?key=${encodeURIComponent(state.key)}` : ''); }
    function resetReport() { state.reportAbort?.abort(); state.reportAbort = null; state.reportText = ''; state.reportGeneratedAt=''; $('analyzeReport').textContent='大模型分析'; $('agentOutput').textContent = '点击“大模型分析”，将精简后的算法记录发送给已配置的模型。'; $('agentOutput').className = 'agent-output muted'; $('stopReport').disabled = true; $('downloadReport').disabled = true; $('captureReport').disabled = true; }
    async function loadAgentStatus() { const button=$('analyzeReport'); button.disabled=true; try { const info=await json(`/workbench/events/${encodeURIComponent(state.currentEvent.id)}/agent/status${detailKey()}`); if(!info.record_complete){$('agentStatus').textContent='记录尚未形成 type5，暂不能分析';return;} if(!info.enabled){$('agentStatus').textContent='功能未启用：请在开发者配置中设置 agent.enabled=true';return;} if(!info.ready){$('agentStatus').textContent=info.unavailable_reason||'大模型配置未就绪';return;} $('agentStatus').textContent=`已就绪 · ${info.model}`; button.disabled=false; } catch(e) { $('agentStatus').textContent='报告服务状态读取失败：'+e.message; } }
    async function loadCachedReport() { try { const cached=await json(`/workbench/events/${encodeURIComponent(state.currentEvent.id)}/agent/report${detailKey()}`); if(!cached.available)return; state.reportText=cached.report||'';state.reportGeneratedAt=cached.generatedAt||'';$('agentOutput').textContent=state.reportText;$('agentOutput').className='agent-output';$('agentStatus').textContent=`已加载本地报告${cached.generatedAt?' · '+cached.generatedAt:''}${cached.model?' · '+cached.model:''}`;$('analyzeReport').textContent='重新分析并更新';$('downloadReport').disabled=false;$('captureReport').disabled=false; } catch(e) { console.warn('读取本地报告失败',e); } }
    function stageExtra(stage){const parts=[];if(stage.type===3)parts.push('水流：已检测');if(stage.type===4||stage.type===5)parts.push(`有效检水时长：${Number(stage.totalWashDuration??stage.washDuration??0).toFixed(1)} s`);if(stage.type===5&&stage.directionLabel)parts.push(`方向：${stage.directionLabel}`);if(stage.type===6&&stage.perIdVideoEnabled!==null&&stage.perIdVideoEnabled!==undefined)parts.push(`单车录像：${stage.perIdVideoEnabled?'已启用':'未启用'}`);return parts.join(' · ');}
    async function showDetail(id) { const data = await json(`/workbench/events/${encodeURIComponent(id)}${detailKey()}`); state.currentEvent=data; $('detailTitle').textContent = `事件 ${data.id}`; $('detailMeta').textContent = `${data.configName || '未知配置'} · ${data.captureTime || '-'} · ${data.lane || '-'} · ${data.plateNumber || '未识别'} · ${data.directionLabel || '方向未判定'}`; $('timeline').innerHTML = (data.stages || []).map(stage => `<div class="stage"><strong>Type ${stage.type} · ${stage.label||''}</strong> · ${stage.captureTime || '-'}<div class="muted">${stage.description||''}</div>${stageExtra(stage)?`<div>${stageExtra(stage)}</div>`:''}${stage.isAbnormal ? `<div class="danger">阶段异常：${stage.abnormalReason || '异常'}</div>` : ''}</div>`).join('') || '<div class="empty">暂无阶段记录</div>'; const shots=(data.stages||[]).filter(stage=>stage.captureImage); $('captureGallery').innerHTML=shots.length?shots.map(stage=>{const src=mediaUrl(stage.captureImage);return `<figure class="shot"><a href="${src}" target="_blank"><img src="${src}" loading="lazy" alt="Type ${stage.type} 事件截图"></a><figcaption>Type ${stage.type} · ${stage.label||''} · ${stage.captureTime||'-'}</figcaption></figure>`;}).join(''):'<div class="empty">该业务 ID 暂无阶段截图</div>'; const videoBox=$('videoBox'); if(data.videoPath){const src=mediaUrl(data.videoPath);videoBox.className='';videoBox.innerHTML=`<video class="event-video" controls preload="metadata" src="${src}">浏览器不支持视频播放。</video><div class="muted" style="margin-top:6px"><a href="${src}" target="_blank">在新窗口打开录像</a></div>`;}else{videoBox.className='empty';videoBox.textContent='该业务 ID 暂无单车录像';} $('wheelResults').textContent = data.wheelResults?.length ? JSON.stringify(data.wheelResults, null, 2) : '暂无车轮结果'; $('rawEvent').textContent = JSON.stringify(data, null, 2); resetReport(); $('detail').showModal(); await loadAgentStatus(); await loadCachedReport(); }
    function handleSseBlock(block) { let name='message', data=''; for(const line of block.split(/\r?\n/)){if(line.startsWith('event:'))name=line.slice(6).trim();else if(line.startsWith('data:'))data+=line.slice(5).trim();} if(!data)return; const payload=JSON.parse(data); if(name==='token'){state.reportText+=payload.text||'';$('agentOutput').textContent=state.reportText;$('agentOutput').scrollTop=$('agentOutput').scrollHeight;} else if(name==='error'){throw new Error(payload.message||'报告生成失败');} }
    async function analyzeReport() { if(!state.currentEvent)return; resetReport(); const controller=new AbortController(); state.reportAbort=controller; $('analyzeReport').disabled=true; $('stopReport').disabled=false; $('agentStatus').textContent='正在重新分析，完成后自动覆盖本地报告…'; $('agentOutput').textContent=''; $('agentOutput').className='agent-output generating'; try { const response=await fetch(`/workbench/events/${encodeURIComponent(state.currentEvent.id)}/agent/report${detailKey()}`,{method:'POST',signal:controller.signal}); if(!response.ok){const errorBody=await response.text();let message=errorBody;try{message=JSON.parse(errorBody)?.detail||errorBody;}catch(_ignored){}throw new Error(message||`HTTP ${response.status}`);} const reader=response.body.getReader(),decoder=new TextDecoder(); let buffer=''; while(true){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done}).replace(/\r\n/g,'\n');let cut;while((cut=buffer.indexOf('\n\n'))>=0){const block=buffer.slice(0,cut);buffer=buffer.slice(cut+2);if(block.trim())handleSseBlock(block);}if(done)break;} if(!state.reportText)throw new Error('大模型未返回报告内容'); state.reportGeneratedAt=new Date().toISOString();$('agentStatus').textContent='报告生成完成并已保存到本地，可下载或导出截图';$('analyzeReport').textContent='重新分析并更新'; $('downloadReport').disabled=false; $('captureReport').disabled=false; } catch(e) { if(e.name==='AbortError'){$('agentStatus').textContent='已停止生成；原本地报告未被覆盖';if(state.reportText){$('downloadReport').disabled=false;$('captureReport').disabled=false;}}else{$('agentStatus').textContent='生成失败：'+e.message;$('agentOutput').textContent=state.reportText||'未生成报告。';} } finally { state.reportAbort=null;$('stopReport').disabled=true;$('analyzeReport').disabled=false;$('agentOutput').className='agent-output'; } }
    function reportFileName(ext){const id=String(state.currentEvent?.id||'record').replace(/[^\w\u4e00-\u9fff.-]+/g,'_');return `过车分析报告_${id}.${ext}`;} function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
    function downloadReport(){const head=`# 过车记录分析报告\n\n记录 ID：${state.currentEvent?.id||'-'}\n生成时间：${new Date().toLocaleString()}\n\n`;downloadBlob(new Blob([head+state.reportText],{type:'text/markdown;charset=utf-8'}),reportFileName('md'));}
    function captureReport(){const width=1200,pad=64,lineHeight=38;const canvas=document.createElement('canvas'),probe=canvas.getContext('2d');probe.font='26px "Microsoft YaHei", sans-serif';const content=`过车记录分析报告\n记录 ID：${state.currentEvent?.id||'-'}\n生成时间：${new Date().toLocaleString()}\n\n${state.reportText}`;const lines=[];for(const paragraph of content.split('\n')){if(!paragraph){lines.push('');continue;}let line='';for(const ch of paragraph){if(probe.measureText(line+ch).width>width-pad*2&&line){lines.push(line);line=ch;}else line+=ch;}lines.push(line);}canvas.width=width;canvas.height=Math.max(400,pad*2+lines.length*lineHeight);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#17202a';ctx.font='26px "Microsoft YaHei", sans-serif';ctx.textBaseline='top';lines.forEach((line,i)=>ctx.fillText(line,pad,pad+i*lineHeight));canvas.toBlob(blob=>blob&&downloadBlob(blob,reportFileName('png')),'image/png');}
    async function refresh() { await Promise.all([loadRuntime(), loadEvents()]); }
    $('refresh').onclick = () => { state.page = 1; refresh(); }; $('search').onkeydown = (event) => { if (event.key === 'Enter') { state.page = 1; refresh(); } }; $('status').onchange = () => { state.page = 1; refresh(); }; $('abnormal').onchange = () => { state.page = 1; refresh(); }; $('prev').onclick = () => { state.page--; refresh(); }; $('next').onclick = () => { state.page++; refresh(); }; $('analyzeReport').onclick=analyzeReport; $('stopReport').onclick=()=>state.reportAbort?.abort(); $('downloadReport').onclick=downloadReport; $('captureReport').onclick=captureReport; $('closeDetail').onclick = () => { state.reportAbort?.abort(); $('detail').close(); };
    (async () => { await loadConfigs(); await refresh(); })().catch(err => { $('rows').innerHTML = `<tr><td colspan="10" class="empty">读取失败：${err.message}</td></tr>`; });
  </script>
</body>
</html>
