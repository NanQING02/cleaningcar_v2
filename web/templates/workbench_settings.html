<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CleaningCar 工作台设置</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #10151c; color: #e8edf4; } * { box-sizing: border-box; } body { margin: 0; background: #10151c; } header { padding: 16px 24px; background: #171e27; border-bottom: 1px solid #2a3442; display:flex; justify-content:space-between; gap:12px; align-items:center; } h1,h2,h3 { margin:0 0 12px; } h1 {font-size:20px;} h2 {font-size:17px;} h3 {font-size:14px;color:#b9c7d8;} a,button { color:inherit; font:inherit; border:1px solid #344355; border-radius:6px; padding:8px 12px; background:#202a37; text-decoration:none; cursor:pointer; } button.primary { background:#2d6ea8;border-color:#4d94d2;} main { max-width:1500px;margin:0 auto;padding:24px; } .layout { display:grid; grid-template-columns:minmax(320px,420px) minmax(420px,1fr); gap:18px; } section { background:#151c24;border:1px solid #2a3442;border-radius:8px;padding:18px; } .form { display:grid; gap:10px; } label { display:grid; gap:5px; color:#aebdcd; font-size:13px; } input,select { min-height:36px;border:1px solid #344355;border-radius:6px;background:#0d131a;color:#e8edf4;padding:7px 10px; } .row { display:flex;flex-wrap:wrap;gap:8px;align-items:center; } .muted { color:#8d9bad; } .message { min-height:22px;color:#91e1bb; } canvas { width:100%; max-height:600px; background:#0b0f14;border:1px solid #334356;border-radius:6px;cursor:crosshair; } img { max-width:100%;border:1px solid #334356;border-radius:6px; } pre { white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;background:#0d131a;padding:10px;border-radius:6px;color:#b9c7d8; } @media(max-width:900px){.layout{grid-template-columns:1fr;}} 
  </style>
</head>
<body>
  <header><div><h1>工作台 · 系统设置</h1><div class="muted">配置、区域与推理控制</div></div><div class="row"><a href="/workbench">返回事件台账</a><a href="/legacy/zone-editor" target="_blank">打开旧版控制台</a></div></header>
  <main><div class="layout"><section><h2>操作员配置</h2><div class="form"><label>配置文件<select id="config"></select></label><label>设备 ID<input id="device_id"></label><label>车道名称<input id="lane_name"></label><label>主视频源<input id="video_source"></label><label>接口地址<input id="api_url"></label><label>接口 Token<input id="api_token" type="password"></label><label>车轮旁路<input id="wheel_enabled" type="checkbox"></label><label>左车轮视频源<input id="left_source"></label><label>右车轮视频源<input id="right_source"></label><label>按车 ID 录像<input id="per_id_video" type="checkbox"></label><label>录像目录<input id="per_id_video_dir"></label><div class="row"><button class="primary" id="save">保存用户配置</button><button id="reload">重新加载</button></div><div id="message" class="message" aria-live="polite"></div></div><h2 style="margin-top:24px">大模型报告</h2><div class="form"><label>启用大模型分析<input id="agent_enabled" type="checkbox"></label><label>OpenAI 兼容接口地址<input id="agent_base_url" placeholder="https://api.deepseek.com"></label><label>模型名称<input id="agent_model" placeholder="deepseek-v4-flash"></label><label>API Key 环境变量名<input id="agent_api_key_env" placeholder="DEEPSEEK_API_KEY"></label><div class="row"><button id="saveAgent">保存大模型配置</button></div><p class="muted">密钥本身不会写入配置或发送到浏览器，请在启动 Web 服务的环境中设置上述环境变量。</p></div><h2 style="margin-top:24px">开发者配置</h2><p class="muted">算法阈值、调试帧、心跳、车轮旁路及大模型高级参数通过 JSON 白名单管理，修改前请确认测试目的。</p><textarea id="developerJson" style="width:100%;min-height:180px;font:12px monospace;background:#0d131a;color:#e8edf4;border:1px solid #344355;border-radius:6px;padding:10px"></textarea><div class="row" style="margin-top:8px"><button id="saveDeveloper">保存开发者配置</button><button id="reloadDeveloper">重新加载开发者配置</button></div><h2 style="margin-top:24px">推理控制</h2><div class="row"><button id="start">启动</button><button id="stop">停止</button><button id="restart">重启</button><span id="inferStatus" class="muted">-</span></div></section><section><h2>Zone 与流向</h2><div class="row"><button id="modeA" class="primary">编辑 Zone A</button><button id="modeB">编辑 Zone B</button><button id="modeFlow">编辑流向</button><button id="resetCurrent">一键重置当前区域</button><button id="saveZones">保存区域</button><button id="reloadFrame">刷新背景帧</button></div><p class="muted">Zone：点击添加顶点，拖动顶点微调，右键撤销最近点。流向：绿色箭头从“起点”指向“终点”，可直接拖动两个圆点调整方向；也可点击空白处重新放置。</p><canvas id="canvas" width="960" height="540"></canvas><h2 style="margin-top:24px">调试帧</h2><button id="debug">获取最新调试帧</button><div id="debugBox" style="margin-top:10px" class="muted">尚未获取</div><pre id="zonesText"></pre></section></div></main>
  <script>
    const $=id=>document.getElementById(id); const sourceLabel=document.createElement('label'); sourceLabel.innerHTML='录像画面来源<select id="per_id_video_source"><option value="annotated">调试帧（带标注）</option><option value="raw">原始帧</option></select>'; $('per_id_video_dir').parentElement.before(sourceLabel); const state={key:'',data:null,zones:null,mode:'zone_a',frame:null}; const fields={device_id:['system','device_id'],lane_name:['logic','lane_name'],video_source:['video','source'],api_url:['system','api','url'],api_token:['system','api','token'],wheel_enabled:['wheel','enabled'],left_source:['wheel','left_source'],right_source:['wheel','right_source'],per_id_video:['logic','enable_per_id_video'],per_id_video_source:['logic','per_id_video_source'],per_id_video_dir:['logic','per_id_video_dir']};
    async function json(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json();} function keyed(path){return state.key?`${path}${path.includes('?')?'&':'?'}key=${encodeURIComponent(state.key)}`:path;} function get(obj,path){return path.reduce((x,k)=>x?.[k],obj);} function set(obj,path,v){let x=obj;path.slice(0,-1).forEach(k=>x=x[k]??=(typeof k==='string'?{}:{}));x[path[path.length-1]]=v;}
    async function loadConfigs(){const d=await json('/config/files');const s=$('config');s.innerHTML='';for(const n of d.files||[]){const o=document.createElement('option');o.value=n;o.textContent=n;o.selected=n===(state.key||d.active);s.appendChild(o);}state.key=s.value===d.active?'':s.value;s.onchange=()=>{state.key=s.value===d.active?'':s.value;load();};}
    async function load(){state.data=await json(keyed('/config'));state.zones=await json(keyed('/zones'));for(const [id,path] of Object.entries(fields))$(id).type==='checkbox'?$(id).checked=!!get(state.data,path):$(id).value=get(state.data,path)??'';const developer=await json(keyed('/config/developer'));$('developerJson').value=JSON.stringify(developer,null,2);const agent=developer.agent||{};$('agent_enabled').checked=!!agent.enabled;$('agent_base_url').value=agent.base_url||'https://api.deepseek.com';$('agent_model').value=agent.model||'deepseek-v4-flash';$('agent_api_key_env').value=agent.api_key_env||'DEEPSEEK_API_KEY';draw();$('zonesText').textContent=JSON.stringify(state.zones,null,2);const st=await json(keyed('/inference/status'));$('inferStatus').textContent=st.running?'运行中':'未运行';}
    function points(name){return state.zones?.[name]||[];} function canvasPoint(e){const r=$('canvas').getBoundingClientRect();return [Math.max(0,Math.min(1,Math.round((e.clientX-r.left)/r.width*10000)/10000)),Math.max(0,Math.min(1,Math.round((e.clientY-r.top)/r.height*10000)/10000))];} function distance(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);} function draw(){const c=$('canvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);if(state.frame){ctx.drawImage(state.frame,0,0,c.width,c.height);} else {ctx.fillStyle='#0b0f14';ctx.fillRect(0,0,c.width,c.height);} for(const [name,color] of [['zone_a_detection','#4d94d2'],['zone_b_wash','#e2a34b']]){const pts=points(name);if(!pts.length)continue;ctx.strokeStyle=color;ctx.fillStyle=color+'44';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>{const x=p[0]*c.width,y=p[1]*c.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.fill();ctx.stroke();pts.forEach((p,i)=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(p[0]*c.width,p[1]*c.height,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e8edf4';ctx.font='12px sans-serif';ctx.fillText(String(i+1),p[0]*c.width+9,p[1]*c.height-8);});}const f=state.zones?.flow_vector;if(f){const sx=f.start[0]*c.width,sy=f.start[1]*c.height,ex=f.end[0]*c.width,ey=f.end[1]*c.height;ctx.strokeStyle='#91e1bb';ctx.fillStyle='#91e1bb';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();const angle=Math.atan2(ey-sy,ex-sx),size=14;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-size*Math.cos(angle-.5),ey-size*Math.sin(angle-.5));ctx.lineTo(ex-size*Math.cos(angle+.5),ey-size*Math.sin(angle+.5));ctx.closePath();ctx.fill();ctx.fillStyle='#e8edf4';ctx.font='12px sans-serif';ctx.fillText('起点',sx+8,sy-8);ctx.fillText('终点',ex+8,ey-8);ctx.beginPath();ctx.arc(sx,sy,9,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(ex,ey,9,0,Math.PI*2);ctx.stroke();}}
    $('canvas').onpointerdown=e=>{e.preventDefault();const p=canvasPoint(e);if(state.mode==='flow'){const f=state.zones.flow_vector||{start:[.5,.2],end:[.5,.8]};const handle=distance(p,f.start)<.05?'start':distance(p,f.end)<.05?'end':null;if(handle){state.dragHandle=handle;$('canvas').setPointerCapture?.(e.pointerId);}else{state.zones.flow_vector={start:p,end:[Math.min(1,p[0]+.12),Math.min(1,p[1]+.12)]};}}else{const key=state.mode==='zone_a'?'zone_a_detection':'zone_b_wash';const idx=points(key).findIndex(item=>distance(p,item)<.05);if(idx>=0){state.dragHandle=idx;$('canvas').setPointerCapture?.(e.pointerId);}else points(key).push(p);}draw();$('zonesText').textContent=JSON.stringify(state.zones,null,2);};
    $('canvas').onpointermove=e=>{if(state.dragHandle===undefined)return;const p=canvasPoint(e);if(state.mode==='flow')state.zones.flow_vector[state.dragHandle]=p;else points(state.mode==='zone_a'?'zone_a_detection':'zone_b_wash')[state.dragHandle]=p;draw();$('zonesText').textContent=JSON.stringify(state.zones,null,2);}; $('canvas').onpointerup=()=>{state.dragHandle=undefined;};
    $('canvas').oncontextmenu=e=>{e.preventDefault();if(state.mode==='flow')state.zones.flow_vector={start:[0.5,0.2],end:[0.5,0.8]};else points(state.mode==='zone_a'?'zone_a_detection':'zone_b_wash').pop();draw();$('zonesText').textContent=JSON.stringify(state.zones,null,2);};
    function setMode(mode){state.mode=mode;['modeA','modeB','modeFlow'].forEach(id=>$(id).classList.remove('primary'));$(mode==='zone_a'?'modeA':mode==='zone_b'?'modeB':'modeFlow').classList.add('primary');$('message').textContent=mode==='flow'?'当前编辑：流向（起点 → 终点，可拖动圆点）':`当前编辑：${mode==='zone_a'?'Zone A':'Zone B'}（可拖动顶点）`;draw();} $('modeA').onclick=()=>setMode('zone_a');$('modeB').onclick=()=>setMode('zone_b');$('modeFlow').onclick=()=>setMode('flow');$('reload').onclick=load;$('config').onchange=()=>{};$('resetCurrent').onclick=()=>{if(state.mode==='flow')state.zones.flow_vector={start:[0.5,0.2],end:[0.5,0.8]};else state.zones[state.mode==='zone_a'?'zone_a_detection':'zone_b_wash']=[];draw();$('zonesText').textContent=JSON.stringify(state.zones,null,2);$('message').textContent='当前编辑区域已重置';};
    $('save').onclick=async()=>{try{const payload={system:{device_id:$('device_id').value,api:{url:$('api_url').value,token:$('api_token').value}},video:{source:$('video_source').value},wheel:{enabled:$('wheel_enabled').checked,left_source:$('left_source').value,right_source:$('right_source').value},logic:{lane_name:$('lane_name').value,enable_per_id_video:$('per_id_video').checked,per_id_video_source:$('per_id_video_source').value,per_id_video_dir:$('per_id_video_dir').value}};await json(keyed('/config/user'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('message').textContent='用户配置已保存';}catch(e){$('message').textContent='保存失败：'+e.message;}};
    $('saveZones').onclick=async()=>{try{await json(keyed('/zones'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.zones)});$('message').textContent='区域已保存';}catch(e){$('message').textContent='区域保存失败：'+e.message;}};$('saveAgent').onclick=async()=>{try{const payload={agent:{enabled:$('agent_enabled').checked,base_url:$('agent_base_url').value,model:$('agent_model').value,api_key_env:$('agent_api_key_env').value}};await json(keyed('/config/developer'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('message').textContent='大模型配置已保存；环境变量变更后需重启 Web 服务';await load();}catch(e){$('message').textContent='大模型配置保存失败：'+e.message;}};$('saveDeveloper').onclick=async()=>{try{const payload=JSON.parse($('developerJson').value);await json(keyed('/config/developer'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('message').textContent='开发者配置已保存';}catch(e){$('message').textContent='开发者配置保存失败：'+e.message;}};$('reloadDeveloper').onclick=load;$('reloadFrame').onclick=async()=>{try{await json(keyed('/frame/reload'),{method:'POST'});const b=await fetch(keyed('/frame'));const blob=await b.blob();state.frame=new Image();state.frame.onload=draw;state.frame.src=URL.createObjectURL(blob);}catch(e){$('message').textContent='背景帧获取失败：'+e.message;}};$('debug').onclick=async()=>{const box=$('debugBox');box.innerHTML='';const img=document.createElement('img');img.src=keyed('/debug_frame')+'&ts='+Date.now();img.alt='最新调试帧';img.onerror=()=>box.textContent='暂无调试帧，请确认推理运行和 debug_frame_path';box.appendChild(img);};for(const [id,path] of [['start','/inference/start'],['stop','/inference/stop'],['restart','/inference/restart']])$(id).onclick=async()=>{try{await json(keyed(path),{method:'POST'});await load();}catch(e){$('message').textContent=e.message;}};(async()=>{await loadConfigs();await load();})().catch(e=>$('message').textContent='加载失败：'+e.message);
  </script>
</body>
</html>
